<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タイムライン - Jenkins Scheduler</title>
  <link rel="stylesheet" href="/static/vendor/vis-timeline/vis-timeline-graph2d.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-timeline">
  <main>
    <div class="toolbar">
      <button class="btn" id="btn-today">今日</button>
      <div class="btn-group">
        <button class="btn" id="btn-prev" title="前へ">◀</button>
        <button class="btn" id="btn-next" title="次へ">▶</button>
      </div>
      <div class="btn-group">
        <button class="btn" data-range="7">1週</button>
        <button class="btn" data-range="28">4週</button>
        <button class="btn" data-range="91">3か月</button>
      </div>
      <div class="btn-group">
        <button class="btn" id="btn-zoom-in" title="拡大">＋</button>
        <button class="btn" id="btn-zoom-out" title="縮小">－</button>
      </div>
      <label class="switch" title="行を日付、列をアイテムにして表示します">
        <input type="checkbox" id="layout-toggle"><span class="switch-track"><span class="switch-thumb"></span></span>
        縦表示
      </label>
      <label class="switch" title="予定や実行結果の丸（run）を表示します。凡例の各項目を押すと、状態ごとに表示・非表示を切り替えられます">
        <input type="checkbox" id="runs-toggle"><span class="switch-track"><span class="switch-thumb"></span></span>
        ビルド状況
      </label>
      <label class="switch" title="凡例（色と模様の意味）を表示します">
        <input type="checkbox" id="legend-toggle"><span class="switch-track"><span class="switch-thumb"></span></span>
        凡例
      </label>
      <div class="legend" id="legend"></div>
    </div>
    <div id="timeline"></div>
    <div id="vgrid" hidden></div>
    <div id="summary-note" class="hint"></div>
  </main>
  <aside id="panel" class="panel hidden"></aside>
  <script src="/static/vendor/vis-timeline/vis-timeline-graph2d.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/schedule-form.js"></script>
  <script src="/static/vertical.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
