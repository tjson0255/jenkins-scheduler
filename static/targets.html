<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アイテム - Jenkins Scheduler</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-narrow">
  <main>
    <section class="card">
      <div class="card-head">
        <h2>アイテム一覧</h2>
      </div>
      <div id="target-list"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>スケジュール一覧</h2>
          <p class="muted small card-note">アイテムを実行するスケジュールの一覧です（テキストのアイテムに書いた予定も含みます）。</p>
        </div>
        <div class="row wrap">
          <span class="hint" id="sync-info"></span>
          <button class="btn" id="btn-sync" title="全アイテムのパラメータ定義と、Jenkins 側 cron の残存を Jenkins から取り直します。通常は5分おきに自動で行います">Jenkins から再取得</button>
          <span class="row" id="schedule-tools"></span>
        </div>
      </div>
      <div id="schedule-list"></div>
    </section>

    <section class="card">
      <h2>アイテムの登録</h2>
      <div class="form" id="register-form"></div>
    </section>

    <section class="card">
      <h2>カテゴリ</h2>
      <div id="category-list"></div>
    </section>

    <section class="card" id="backup-section" hidden>
      <div class="card-head">
        <h2>バックアップ</h2>
        <button class="btn" id="btn-backup">今すぐバックアップ</button>
      </div>
      <div id="backup-list"></div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/schedule-form.js"></script>
  <script src="/static/targets.js"></script>
</body>
</html>
