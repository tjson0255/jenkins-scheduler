<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アイテム - Jenkins Scheduler</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-narrow">
  <main>
    <nav class="tree-steps" aria-label="ページ内の構成">
      <span class="muted small">構成:</span>
      <a href="#sec-categories">カテゴリ</a><span class="tree-sep">›</span>
      <a href="#sec-items">レーン</a><span class="tree-sep">›</span>
      <a href="#sec-schedulers">スケジューラ</a>
    </nav>

    <section class="card" id="sec-categories">
      <h2>カテゴリ</h2>
      <div id="category-list"></div>
    </section>

    <section class="card" id="sec-items">
      <div class="card-head">
        <h2>レーン</h2>
        <div class="row" id="item-tools"></div>
      </div>
      <div id="target-list"></div>
    </section>

    <section class="card" id="sec-schedulers">
      <div class="card-head">
        <h2>スケジューラ</h2>
        <div class="row wrap">
          <span class="hint" id="sync-info"></span>
          <button class="btn" id="btn-sync" title="全レーンのパラメータ定義と、Jenkins 側 cron の残存を Jenkins から取り直します。通常は5分おきに自動で行います">Jenkins から再取得</button>
          <span class="row" id="schedule-tools"></span>
        </div>
      </div>
      <div class="row wrap sched-filters" id="schedule-filters"></div>
      <div id="schedule-list"></div>
    </section>

    <section class="card" id="backup-section" hidden>
      <div class="card-head">
        <h2>バックアップ</h2>
        <button class="btn" id="btn-backup">今すぐバックアップ</button>
      </div>
      <div id="backup-list"></div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/schedule-form.js"></script>
  <script src="/static/targets.js"></script>
</body>
</html>
