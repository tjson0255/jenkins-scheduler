<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>実行結果 - Jenkins Scheduler</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-history">
  <main>
    <section class="card">
      <div class="card-head">
        <div>
          <h2>実行結果</h2>
          <div class="muted small" id="hist-range"></div>
        </div>
        <div class="row wrap">
          <div class="btn-group" role="group" aria-label="表示">
            <button class="btn" data-view="list">一覧</button>
            <button class="btn" data-view="grid">日付の表</button>
          </div>
          <button class="btn" id="hist-prev" title="前の期間">◀</button>
          <button class="btn" id="hist-next" title="次の期間">▶</button>
          <button class="btn" id="hist-today">今日</button>
          <select id="hist-days" aria-label="表示する期間">
            <option value="14">2週</option>
            <option value="28" selected>4週</option>
            <option value="56">8週</option>
          </select>
        </div>
      </div>
      <div class="row wrap hist-filters">
        <select id="hist-lane" aria-label="レーンで絞り込む"></select>
        <input type="search" id="hist-q" placeholder="件名で探す" aria-label="件名で探す">
        <label class="check"><input type="checkbox" id="hist-done"> 実行済みだけ</label>
      </div>
      <div class="hist-legend" id="hist-legend"></div>
      <div id="hist-body"></div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/history.js"></script>
</body>
</html>
